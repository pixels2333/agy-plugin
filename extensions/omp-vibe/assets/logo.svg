<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="vibeGrad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fastGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded TV Wall Frame (10% margin: 14 to 114) -->
  <rect x="14" y="14" width="100" height="100" rx="22" stroke="url(#vibeGrad)" stroke-width="5" fill="#0F172A" fill-opacity="0.88"/>

  <!-- Director Header Bar -->
  <rect x="24" y="24" width="80" height="16" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="3.5" fill="#10B981"/>
  <path d="M41 29L45 35L49 29" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="55" y1="32" x2="96" y2="32" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left TV Screen: FAST Worker (Cyan) -->
  <rect x="24" y="46" width="37" height="36" rx="6" fill="#091526" stroke="url(#fastGrad)" stroke-width="2.5"/>
  <rect x="29" y="51" width="16" height="6" rx="2" fill="#06B6D4"/>
  <line x1="29" y1="63" x2="54" y2="63" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="29" y1="70" x2="48" y2="70" stroke="#0284C7" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="51" y="68" width="4" height="6" fill="#22D3EE"/>

  <!-- Right TV Screen: GOOD Worker (Purple/Gold) -->
  <rect x="67" y="46" width="37" height="36" rx="6" fill="#1A1025" stroke="url(#goodGrad)" stroke-width="2.5"/>
  <rect x="72" y="51" width="16" height="6" rx="2" fill="#A855F7"/>
  <line x1="72" y1="63" x2="97" y2="63" stroke="#E879F9" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="72" y1="70" x2="91" y2="70" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="96" cy="70" r="2.5" fill="#FBBF24"/>

  <!-- Bottom Orchestration Signal Wave -->
  <path d="M26 96 Q 38 88, 50 96 T 74 96 T 98 96" stroke="url(#vibeGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="43" cy="46" r="2" fill="#22D3EE"/>
  <circle cx="85" cy="46" r="2" fill="#C084FC"/>
</svg>
